name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Cache native ffmpeg
        id: ff
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: ffmpeg-arm64-${{ hashFiles('tools/build-ffmpeg.sh') }}

      - name: Build native ffmpeg (arm64, x264)
        if: steps.ff.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm autoconf automake libtool pkg-config
          bash tools/build-ffmpeg.sh

      - name: Prepare the website files for the app
        run: python3 tools/patch_site.py

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: OPTIVERSE-X-METHOD-apk
          path: app/build/outputs/apk/release/*.apk
